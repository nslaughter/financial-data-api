name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The module's minimum version, and the current release.
        go: ['1.22', stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  conformance:
    name: Conformance (stage 2, without exports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o bin/ ./cmd/server ./cmd/conformance
      - name: Start the server
        run: |
          TEST_CONTROL=enabled nohup bin/server > server.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -fsS http://localhost:8080/v1/meta > /dev/null 2>&1; then
              exit 0
            fi
            sleep 0.2
          done
          echo "The server did not become ready:"
          cat server.log
          exit 1
      - name: Run the conformance suite
        # At stage 2, every stage 1 file and the stage 2 files the server
        # serves so far. The server answers published_as_of and
        # GET /v1/revisions, so the stage 1 scenario in request-errors that
        # expects them refused no longer applies. Exports, and with them
        # export-handoff and exports, arrive in step 9 of the implementation
        # plan, which runs every file with --stage 2 alone.
        run: >-
          bin/conformance --base-url http://localhost:8080 --stage 2
          --file august-2026-at-cutoffs --file full-history --file missing-value
          --file withdrawal-and-rerelease --file out-of-order-arrival
          --file provider-correction --file late-source-release
          --file change-stream --file simulated-clock --file pagination
          --file access-control --file request-errors
          --file published-as-of --file revision-history --file release-calendar
          --file release-timing
      - name: Show the server log
        if: failure()
        run: cat server.log
